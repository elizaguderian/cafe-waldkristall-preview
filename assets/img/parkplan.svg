  <title id="pt">Parkplätze am Café Waldkristall</title>
  <desc id="pd">Lageplan: Das Café Waldkristall liegt unten links an der Bergstraße. Drei ausgewiesene Parkplätze: 10 Plätze und 10 Plätze an der Zufahrt links, 30 Plätze weiter oben an der Bergstraße.</desc>
